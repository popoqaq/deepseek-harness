[project]
name = "dsh-mcp-tongdaxin"
version = "0.1.0"
description = "MCP server for read-only A-share market data through the TongdaXin quote protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9.0,<2",
  "pytdx>=1.72",
]

[project.scripts]
tdx-mcp = "tdx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdx_mcp"]
